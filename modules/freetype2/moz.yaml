updatebot:
  maintainer-phab: jfkthame
  maintainer-bz: jfkthame@gmail.com
  try-preset: freetype
  tasks:
    - type: vendoring
      enabled: true
      frequency: 1 week

vendoring:
  url: https://gitlab.freedesktop.org/freetype/freetype
  source-hosting: gitlab
  tracking: commit

  exclude:
    - ".**"
    - autogen.sh
    - builds
    - CMakeLists.txt
    - configure
    - devel
    - docs
    - Makefile
    - meson.build
    - meson_options.txt
    - mkfile
    - MSBuild.rsp
    - MSBuild.sln
    - objs
    - subprojects
    - tests
    - vms_make.com

  keep:
    - moz.build
