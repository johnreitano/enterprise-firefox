[DEFAULT]
head = "head.js"

["test_FeltLocking.js"]

["test_FeltStorage_locking.js"]

["test_felt_browser_endpoint_refusal.js"]
# Launches the application binary with `-felt`, which only macOS reads: Linux
# and Windows take their endpoint from an inherited fd or handle.
run-if = ["os == 'mac' && buildapp == 'browser'"]
run-sequentially = ["true"]

["test_felt_browser_ipc_args.js"]
run-if = ["buildapp == 'browser'"]

["test_felt_ipc_channel_refusal.js"]
run-if = ["buildapp == 'browser'"]
run-sequentially = ["true"] # Launches the application binary
